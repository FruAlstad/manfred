<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>MANFRED</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%23c9b45a' width='100' height='100'/></svg>" />
  </head>
  <body>
    <div id="app">
      <canvas id="scene"></canvas>

      <div id="vignette" aria-hidden="true"></div>
      <div id="grain" aria-hidden="true"></div>
      <div id="crosshair" hidden>+</div>
      <div id="stamina" hidden><i></i></div>
      <p id="hint" hidden>find the exit. do not let it find you.</p>

      <div id="overlay" class="overlay">
        <p class="whisper">if you're not careful and you noclip out of reality…</p>
        <h1>MANFRED</h1>
        <p class="sub">you will end up in the backrooms</p>
        <button id="start-btn" type="button">NO-CLIP</button>
        <p class="controls">WASD move · mouse look · shift run · esc pause</p>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
